[project]
name = "fieldflow-orchestrator"
version = "0.1.0"
description = "FieldFlow AI orchestrator — the AI brain (FastAPI + LangGraph). Commerce lives here as a module."
requires-python = ">=3.11"
dependencies = [
    "fieldflow-contract",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aio-pika>=9.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "langgraph>=0.2",
    "structlog>=24.1",
    "pydantic-settings>=2.4",
    "prometheus-client>=0.20",
    "llama-index-core>=0.14.25",
    "llama-index-vector-stores-postgres>=0.9.0",
    "llama-index-embeddings-jinaai>=0.7.0",
    "llama-index-postprocessor-jinaai-rerank>=0.6.0",
    "pypdf>=6.19.0",
    "reportlab>=5.0.1",
    "groq>=0.11",
    "google-genai>=0.3",
    "razorpay>=2.0.1",
    "httpx>=0.28.1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[tool.uv.sources]
fieldflow-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
