[project]
name = "fieldflow-contract"
version = "0.1.0"
description = "Shared event + tool contract for FieldFlow AI (Pydantic models)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldflow_contract"]
